# Stage-2: CUPS-original DINO ResNet-50 + Cascade Mask R-CNN
# Pseudo-labels: DCFA + DepthPro + SIMCF-ABC (PQ=25.85, PQ_things=14.70)
#   - DCFA: feature-level depth adapter (40K params, +0.68 PQ)
#   - DepthPro: depth-guided instances (tau=0.20, A_min=1000)
#   - SIMCF-ABC: label-level filtering (+0.73 PQ)
#   - Combined: near-additive composition (+1.31 PQ over raw k=80)
#
# Goal: Apples-to-apples vs the published CUPS Stage-2 backbone
# (same backbone family, same recipe). Isolates the pseudo-label-source
# contribution by replacing CUPS' stereo/video labels with our monocular
# DCFA + DepthPro + SIMCF-ABC labels while keeping everything else fixed.
#
# Target: santosh@172.17.254.146, 2x GTX 1080 Ti (11 GB each)
# Effective batch: 2 GPUs x bs=2 x accum=4 = 16  (matches DINOv3 run for fairness)
# Expected: ~75-90 min for 8000 steps on 2x 1080 Ti (ResNet-50 is faster than ViT-B)

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "resnet50"
  USE_DINO: True
  TTA_SCALES:
    - 0.75
    - 1.0
    - 1.25

AUGMENTATION:
  NUM_STEPS_STARTUP: 500
  COPY_PASTE: True
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]
    - [480, 960]
    - [512, 1024]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 4
  LOG_PATH: "/home/santosh/cups/experiments"
  RUN_NAME: "cups_resnet50_dcfa_simcf_abc_2gpu"

TRAINING:
  STEPS: 8000
  BATCH_SIZE: 2
  ACCUMULATE_GRAD_BATCHES: 4
  PRECISION: "16-mixed"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 1000
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 500
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
