# Stage-4 Combined: SAMRefiner + Motorcycle Injection + Stuff-Channel Recovery (pole, traffic light)
#
# Pseudo-labels (LOCAL → transfer to remote before launching):
#   cups_pseudo_labels_sam3_combined/:
#     - SAMRefiner boundaries (IoU≥0.50 best-overlap SAM3 mask, 20.6% accept, +3.87 PQ_things)
#     - Motorcycle instances injected (SAM3 label 2 → cluster 41, 820 instances / 525 images)
#     Evaluation: PQ=27.51%, PQ_stuff=34.02%, PQ_things=18.57%, mIoU=56.22%
#
# Online FINE_OBJECT with stuff-channel injection:
#   - traffic light (SAM3 label 5) → CUPS stuff channel 18 (9,687 masks / 1,700 images)
#   - pole         (SAM3 label 13) → CUPS stuff channel 24 (40,031 masks / 2,956 images)
#   - LOAD_CLASS_LABELS=[5,13] ensures ONLY stuff masks are loaded — thing focal CE never fires,
#     preventing the bicycle/rider regression observed in prior Stage-4 FINE_OBJECT runs.
#
# Safety constraints (same as motorcycle_recovery config):
#   - Seesaw P=0.5 amplifies rare-class instance gradients
#   - DropLoss threshold=0.25 (allows weak early preds to contribute)
#   - LR=0.000025 (conservative fine-tune, not full retrain)
#   - Abort if PQ < 35.0 or bicycle/rider regress by >1.0 PQ
#
# Transfer pseudo-labels before launching (on remote):
#   scp -r cups_pseudo_labels_sam3_combined/ santosh@100.93.203.100:/home/santosh/datasets/cityscapes/
#
# Launch (on remote):
#   nohup python -u refs/cups/train_self.py \
#       --config refs/cups/configs/train_self_cityscapes_dinov3_vitb_stage4_combined.yaml \
#       > logs/stage4_combined.log 2>&1 &

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_sam3_combined/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  CHECKPOINT: "/home/santosh/experiments/stage3_dcfa_simcf_abc/experiments/cups_dinov3_vitb_dcfa_simcf_abc_stage3/Unsupervised Panoptic Segmentation/mc039mj8/checkpoints/best_pq_step=003000.ckpt"
  ROI_BOX_HEAD:
    USE_SEESAW_LOSS: True
    SEESAW_P: 0.5
    SEESAW_Q: 2.0
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage4_combined"
  RUN_NAME: "cups_dinov3_vitb_stage4_combined"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.000025
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.25
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 2500
  ROUNDS: 1
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.5
  CLASS_FREQUENCIES:
    - 3.30489841e-01
    - 5.06482363e-02
    - 6.32741451e-03
    - 1.56909180e-03
    - 1.99857380e-01
    - 6.57570076e-03
    - 7.78623772e-03
    - 3.02487373e-04
    - 2.11625957e-03
    - 1.55002594e-04
    - 1.09297848e-02
    - 7.80897141e-05
    - 2.00032711e-03
    - 4.34155369e-03
    - 1.42278225e-01
    - 1.12963581e-02
    - 3.66815948e-02
    - 9.90688801e-03
    - 1.26592636e-03
    - 6.36131363e-02
    - 1.95193195e-03
    - 2.22380924e-03
    - 2.42261887e-04
    - 1.79514885e-04
    - 2.21147919e-03
    - 5.97167969e-04
    - 3.30391884e-03
  FINE_OBJECT:
    ENABLED: True
    SAM_MASKS_DIR: "/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/"
    # Stuff-only injection: pole (13→24) + traffic light (5→18)
    # Encoded as [[sam3_label, cups_channel], ...] — yacs does not support dicts
    STUFF_CHANNEL_MAP:
      - [5, 18]    # traffic light → CUPS stuff channel 18
      - [13, 24]   # pole → CUPS stuff channel 24
    # Load ONLY stuff-class masks — prevents thing focal CE from firing on person/bicycle/car masks.
    # Without this filter, thing masks trigger channel-0 focal loss which regressed bicycle -7.9%
    # and rider -6.9% in a prior Stage-4 FINE_OBJECT run.
    LOAD_CLASS_LABELS:
      - 5    # traffic light (stuff)
      - 13   # pole (stuff)
    MODE: "thing_focal_stuff_entropy"
    WEIGHT: 0.05
    MIN_IOU_SCORE: 0.60
    MAX_MASKS_PER_IMAGE: 30
    FOCAL_GAMMA: 2.0
    USE_IOU_WEIGHTING: True
    MIN_HARD_IOU: 0.10
    THING_CLASS_IDX: 0

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
