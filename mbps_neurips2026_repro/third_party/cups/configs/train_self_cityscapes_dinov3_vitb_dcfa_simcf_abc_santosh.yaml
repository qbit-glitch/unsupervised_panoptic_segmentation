# Stage-3: Self-training on DCFA+DepthPro+SIMCF-ABC pseudo-labels.
# Loads Stage-2 best checkpoint (PQ=27.88, step 744) and refines via EMA self-training.
# Target: santosh@172.17.254.146, 2x GTX 1080 Ti (11 GB each)
#
# Based on DA3+CAUSE-TR Stage-3 config (which achieved +2.35 PQ gain).
# SELF_TRAINING: 3 rounds x 4000 steps = 12000 optimizer steps total.
# Expected: ~5-6 hours on 2x 1080 Ti.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  CHECKPOINT: "/home/santosh/experiments/stage2_dcfa_simcf_abc/experiments/cups_dinov3_vitb_dcfa_simcf_abc_2gpu/Unsupervised Panoptic Segmentation/v70uy7wv/checkpoints/best_pq_step=000744.ckpt"
  ROI_BOX_HEAD:
    USE_SEESAW_LOSS: True
    SEESAW_P: 0.8
    SEESAW_Q: 2.0
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage3_dcfa_simcf_abc"
  RUN_NAME: "cups_dinov3_vitb_dcfa_simcf_abc_stage3"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 200
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 4000
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.3
  CLASS_FREQUENCIES:
    - 3.30489841e-01
    - 5.06482363e-02
    - 6.32741451e-03
    - 1.56909180e-03
    - 1.99857380e-01
    - 6.57570076e-03
    - 7.78623772e-03
    - 3.02487373e-04
    - 2.11625957e-03
    - 1.55002594e-04
    - 1.09297848e-02
    - 7.80897141e-05
    - 2.00032711e-03
    - 4.34155369e-03
    - 1.42278225e-01
    - 1.12963581e-02
    - 3.66815948e-02
    - 9.90688801e-03
    - 1.26592636e-03
    - 6.36131363e-02
    - 1.95193195e-03
    - 2.22380924e-03
    - 2.42261887e-04
    - 1.79514885e-04
    - 2.21147919e-03
    - 5.97167969e-04
    - 3.30391884e-03

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
