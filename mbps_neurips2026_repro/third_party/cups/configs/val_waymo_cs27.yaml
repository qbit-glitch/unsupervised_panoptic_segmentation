# Waymo V2 cross-dataset evaluation under the CUPS 27-class in-domain protocol.
# Same checkpoint as Cityscapes headline: stage3_dcfa_simcf_abc/best_pq_step=003000.

DATA:
  CROP_RESOLUTION: (640, 960)
  VAL_SCALE: 0.5
  SCALE: 0.625
  DATASET: "waymo"
  ROOT: "/Volumes/code_files/datasets/panoptic_segmentation_datasets/waymo_v2_0_1_preprocessed"
  ROOT_VAL: "/Volumes/code_files/datasets/panoptic_segmentation_datasets/waymo_v2_0_1_preprocessed"
  ROOT_PSEUDO: ""
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  NUM_CLASSES: 27
  NUM_PSEUDO_CLASSES: 27
MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  CHECKPOINT: "/Users/qbit-glitch/Desktop/coding-projects/mbps_panoptic_segmentation/checkpoints/stage3_dcfa_simcf_abc/best_pq_step=003000.ckpt"
  TTA_SCALES:
    - 0.75
    - 1.0
AUGMENTATION:
  NUM_STEPS_STARTUP: 500
  COPY_PASTE: False
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [640, 1280]
SYSTEM:
  ACCELERATOR: "cpu"
  NUM_GPUS: 1
  NUM_NODES: 1
  NUM_WORKERS: 0
  LOG_PATH: "experiments"
  RUN_NAME: "waymo_cs27_val"
TRAINING:
  BATCH_SIZE: 1
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 1000
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 0.1
SELF_TRAINING:
  ROUND_STEPS: 500
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
