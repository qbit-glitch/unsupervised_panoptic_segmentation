# Stage-2: DINOv3 ViT-B/16 Cascade Mask R-CNN on DCFA+DepthPro+SIMCF-ABC pseudo-labels.
# Target: santosh@100.93.203.100, 2x GTX 1080 Ti (11 GB each)
#
# Pseudo-labels: DCFA + DepthPro + SIMCF-ABC (PQ=25.85, PQ_things=14.70)
#   - DCFA: feature-level depth adapter (40K params, +0.68 PQ)
#   - DepthPro: depth-guided instances (tau=0.20, A_min=1000)
#   - SIMCF-ABC: label-level filtering (+0.73 PQ)
#   - Combined: near-additive composition (+1.31 PQ over raw k=80)
#
# Effective batch: 2 GPUs x bs=1 x accum=8 = 16
# Expected: ~90 min for 8000 steps on 2x 1080 Ti

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  TTA_SCALES:
    - 0.75
    - 1.0
    - 1.25

AUGMENTATION:
  NUM_STEPS_STARTUP: 500
  COPY_PASTE: True
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]
    - [480, 960]
    - [512, 1024]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage2_dcfa_simcf_abc"
  RUN_NAME: "cups_dinov3_vitb_dcfa_simcf_abc_2gpu"

TRAINING:
  STEPS: 8000
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 1000
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 0.1

SELF_TRAINING:
  ROUND_STEPS: 500
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
