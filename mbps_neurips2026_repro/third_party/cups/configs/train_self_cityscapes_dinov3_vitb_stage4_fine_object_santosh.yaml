# Stage-4: Fine-Object SAM Supervision fine-tuning.
#
# Continues from the Stage-3 best checkpoint with ALL Stage-3 losses and
# augmentations intact, and adds a SAM-mask supervision term that forces
# the semantic head to produce confident predictions inside SAM-detected
# fine-grained object regions (bicycle, motorcycle, rider, traffic sign, …).
#
# Pipeline:
#   1. Generate SAM3 masks locally (runs ~5.4h for full train split on MPS):
#        HF_TOKEN=$(cat ~/.cache/huggingface/token) \
#        python -u scripts/generate_sam_fine_masks.py \
#            --cityscapes_root /path/to/cityscapes \
#            --split train --backend sam3 \
#            --device mps --resize_height 512 \
#            > logs/sam3_train_full.log 2>&1 &
#
#   2. Copy masks to remote:
#        rsync -avz cityscapes/sam_fine_masks_sam3/train/ \
#            santosh@172.17.254.146:/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/
#
#   3. Launch Stage-4:
#        nohup python -u refs/cups/train_self.py \
#            --config refs/cups/configs/train_self_cityscapes_dinov3_vitb_stage4_fine_object_santosh.yaml \
#            > logs/stage4_fine_object.log 2>&1 &
#
# Expected runtime: ~1-2 hours on 2x GTX 1080 Ti (1 round x 2000 steps).
# Expected gain: +1-3 PQ on bicycle/motorcycle/rider classes.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  # Use the same pseudo-labels as Stage-3 (DCFA+SIMCF-ABC)
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  # Load Stage-3 best checkpoint — update path after Stage-3 completes
  CHECKPOINT: "/home/santosh/experiments/stage3_dcfa_simcf_abc/experiments/cups_dinov3_vitb_dcfa_simcf_abc_stage3/Unsupervised Panoptic Segmentation/mc039mj8/checkpoints/best_pq_step=003000.ckpt"
  ROI_BOX_HEAD:
    USE_SEESAW_LOSS: True
    SEESAW_P: 0.8
    SEESAW_Q: 2.0
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage4_fine_object"
  RUN_NAME: "cups_dinov3_vitb_stage4_fine_object"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    # Lower LR than Stage-3 (0.0001) — this is a fine-tuning stage
    LEARNING_RATE: 0.00005
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 200
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  # 1 round x 2000 steps — shorter than Stage-3 (3 rounds x 4000 steps)
  # because we are fine-tuning a strong Stage-3 model, not training from scratch.
  ROUND_STEPS: 2000
  ROUNDS: 1
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.3
  CLASS_FREQUENCIES:
    - 3.30489841e-01
    - 5.06482363e-02
    - 6.32741451e-03
    - 1.56909180e-03
    - 1.99857380e-01
    - 6.57570076e-03
    - 7.78623772e-03
    - 3.02487373e-04
    - 2.11625957e-03
    - 1.55002594e-04
    - 1.09297848e-02
    - 7.80897141e-05
    - 2.00032711e-03
    - 4.34155369e-03
    - 1.42278225e-01
    - 1.12963581e-02
    - 3.66815948e-02
    - 9.90688801e-03
    - 1.26592636e-03
    - 6.36131363e-02
    - 1.95193195e-03
    - 2.22380924e-03
    - 2.42261887e-04
    - 1.79514885e-04
    - 2.21147919e-03
    - 5.97167969e-04
    - 3.30391884e-03

  FINE_OBJECT:
    ENABLED: True
    # Weight relative to standard Stage-3 losses.
    # History: 0.05 → -1.4 PQ degradation (non-selective signal, no teacher gate).
    # Exp 1 (thing_mc_panda) starts at 0.01 — lower to avoid collateral gradient damage.
    WEIGHT: 0.01
    SAM_MASKS_DIR: "/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/"
    # Mode: "thing_mc_panda" (Exp 1 — MC-PanDA ECCV 2024 + S2C CVPR 2024)
    #   Gates each mask's loss by (1 - teacher_P(thing_channel)).
    #   Car/person pixels (high P_teacher(thing)) → near-zero gradient.
    #   Bicycle/motorcycle pixels (low P_teacher(thing)) → full gradient.
    #   Stuff predictions completely untouched (stuff masks skipped).
    #
    # To switch experiments: change MODE and adjust other params below.
    #   "thing_focal_per_class_freq" (Exp 2): EFL gamma scaling (CVPR 2022)
    #   "thing_focal_stuff_kd"       (Exp 3): Incrementer KD anchor (CVPR 2023)
    #   "thing_focal_only"           (Exp 0 baseline, no teacher gating)
    MODE: "thing_mc_panda"
    FOCAL_GAMMA: 2.0
    USE_IOU_WEIGHTING: True
    MIN_HARD_IOU: 0.10
    MIN_IOU_SCORE: 0.10
    MAX_MASKS_PER_IMAGE: 30
    THING_CLASS_IDX: -1
    # Maps SAM3 stuff class index → semantic head channel (from extract_cups_class_mapping.py).
    STUFF_CHANNEL_MAP:
      - [4, 54]    # traffic sign  → channel 54
      - [5, 18]    # traffic light → channel 18
      - [9, 62]    # guard rail    → channel 62 (only 401 px; weak signal)
      - [13, 24]   # pole          → channel 24

    # ── Exp 1 (thing_mc_panda) ────────────────────────────────────────────
    # Gate by teacher P(channel 0) = P(unified thing region).
    # For k=80 CUPS heads channel 0 = thing region; set to [0].
    COMMON_THING_CHANNEL_INDICES:
      - 0
    TEACHER_LOGIT_WEIGHT: 1.0

    # ── Exp 2 (thing_focal_per_class_freq) ───────────────────────────────
    # Per-SAM3-class frequency estimates (order: person/bicycle/.../car/pole).
    # E_c = 1 - sigmoid((n_c - mu) / sigma) → higher gamma for rare classes.
    CLASS_FREQUENCIES_SAM3:
      - 0.038   # 0: person
      - 0.001   # 1: bicycle
      - 0.002   # 2: motorcycle
      - 0.003   # 3: rider
      - 0.010   # 4: traffic sign
      - 0.005   # 5: traffic light
      - 0.005   # 6: truck
      - 0.006   # 7: bus
      - 0.002   # 8: train
      - 0.003   # 9: guard rail
      - 0.0001  # 10: caravan
      - 0.0001  # 11: trailer
      - 0.080   # 12: car
      - 0.010   # 13: pole
    GAMMA_SCALE_FACTOR: 1.0

    # ── Exp 3 (thing_focal_stuff_kd) ──────────────────────────────────────
    STUFF_KD_LAMBDA: 0.1
    STUFF_CHANNEL_START: 1

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
