# Stage-3: Self-training of CUPS-original DINO ResNet-50 + Cascade Mask R-CNN
# seeded from best Stage-2 checkpoint on DCFA + DepthPro + SIMCF-ABC labels.
#
# Stage-2 best (val#25, step 3125): PQ_a=0.2453, PQ_b=0.2459, mIoU=0.3517/0.3689
# Source ckpt: best_pq_step=003125.ckpt (882 MB)
#
# Self-training: 3 rounds x 4000 steps = 12000 optimizer steps total.
# Effective batch: 2 GPUs x bs=1 x accum=8 = 16 (matches ResNet-50 k80 Stage-3 pattern).
# Expected: ~5-7 hours on 2x 1080 Ti.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "resnet50"
  USE_DINO: True
  CHECKPOINT: "/home/santosh/cups/experiments/experiments/cups_resnet50_dcfa_simcf_abc_seed43_stage2/Unsupervised Panoptic Segmentation/7cfyse3x/checkpoints/best_pq_step=003125.ckpt"
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/cups/experiments"
  RUN_NAME: "cups_resnet50_dcfa_simcf_abc_seed43_stage3"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "16-mixed"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 200
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 4000
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
