# Stage-2 long-tail ablation Run C: Run B + LDAM semantic-head loss.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/media/santosh/Kuldeep/panoptic_segmentation/datasets/cityscapes/"
  ROOT_VAL: "/media/santosh/Kuldeep/panoptic_segmentation/datasets/cityscapes/"
  ROOT_PSEUDO: "/media/santosh/Kuldeep/panoptic_segmentation/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_depthpro/"
  USE_REPEAT_FACTOR_SAMPLER: True
  RFS_THRESHOLD_T: 0.001
  RFS_PRECOMPUTE_CACHE: "/media/santosh/Kuldeep/panoptic_segmentation/datasets/cityscapes/rfs_cache_t0.json"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  TTA_SCALES:
    - 0.75
    - 1.0
    - 1.25
  ROI_BOX_HEAD:
    USE_EQLV2: True
    EQLV2_GAMMA: 12.0
    EQLV2_MU: 0.8
    EQLV2_ALPHA: 4.0
  SEM_SEG_HEAD:
    LDAM_ENABLED: True
    LDAM_MAX_MARGIN: 0.5
    LDAM_S: 30.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 500
  COPY_PASTE: True
  MAX_NUM_PASTED_OBJECTS: 3
  USE_RARE_POOL: True
  RARE_POOL_PATH: "/media/santosh/Kuldeep/panoptic_segmentation/datasets/cityscapes/rare_instance_pool/pool_t0.pkl"
  RARE_POOL_PASTES_PER_IMAGE: (1, 3)
  RARE_POOL_USE_DEPTH_PLACEMENT: True
  RARE_POOL_CLASS_REPEAT_OVERRIDES: ((11, 4), (12, 4), (18, 4), (14, 8), (15, 8), (16, 8))
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]
    - [480, 960]
    - [512, 1024]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/media/santosh/Kuldeep/panoptic_segmentation/experiments/t0_longtail_runC"
  RUN_NAME: "cups_t0_longtail_runC"

TRAINING:
  STEPS: 8000
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 1000
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 0.1

SELF_TRAINING:
  ROUND_STEPS: 500
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
