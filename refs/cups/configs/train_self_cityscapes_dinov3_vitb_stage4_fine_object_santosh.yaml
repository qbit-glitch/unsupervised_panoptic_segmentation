# Stage-4: Fine-Object SAM Supervision fine-tuning.
#
# Continues from the Stage-3 best checkpoint with ALL Stage-3 losses and
# augmentations intact, and adds a SAM-mask supervision term that forces
# the semantic head to produce confident predictions inside SAM-detected
# fine-grained object regions (bicycle, motorcycle, rider, traffic sign, …).
#
# Pipeline:
#   1. Generate SAM3 masks locally (runs ~5.4h for full train split on MPS):
#        HF_TOKEN=$(cat ~/.cache/huggingface/token) \
#        python -u scripts/generate_sam_fine_masks.py \
#            --cityscapes_root /path/to/cityscapes \
#            --split train --backend sam3 \
#            --device mps --resize_height 512 \
#            > logs/sam3_train_full.log 2>&1 &
#
#   2. Copy masks to remote:
#        rsync -avz cityscapes/sam_fine_masks_sam3/train/ \
#            santosh@172.17.254.146:/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/
#
#   3. Launch Stage-4:
#        nohup python -u refs/cups/train_self.py \
#            --config refs/cups/configs/train_self_cityscapes_dinov3_vitb_stage4_fine_object_santosh.yaml \
#            > logs/stage4_fine_object.log 2>&1 &
#
# Expected runtime: ~1-2 hours on 2x GTX 1080 Ti (1 round x 2000 steps).
# Expected gain: +1-3 PQ on bicycle/motorcycle/rider classes.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  # Use the same pseudo-labels as Stage-3 (DCFA+SIMCF-ABC)
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  # Load Stage-3 best checkpoint — update path after Stage-3 completes
  CHECKPOINT: "/home/santosh/experiments/stage3_dcfa_simcf_abc/experiments/cups_dinov3_vitb_dcfa_simcf_abc_stage3/Unsupervised Panoptic Segmentation/<run_id>/checkpoints/best_pq_step=<step>.ckpt"
  ROI_BOX_HEAD:
    USE_SEESAW_LOSS: True
    SEESAW_P: 0.8
    SEESAW_Q: 2.0
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage4_fine_object"
  RUN_NAME: "cups_dinov3_vitb_stage4_fine_object"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    # Lower LR than Stage-3 (0.0001) — this is a fine-tuning stage
    LEARNING_RATE: 0.00005
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 200
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  # 1 round x 2000 steps — shorter than Stage-3 (3 rounds x 4000 steps)
  # because we are fine-tuning a strong Stage-3 model, not training from scratch.
  ROUND_STEPS: 2000
  ROUNDS: 1
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.3
  CLASS_FREQUENCIES:
    - 3.30489841e-01
    - 5.06482363e-02
    - 6.32741451e-03
    - 1.56909180e-03
    - 1.99857380e-01
    - 6.57570076e-03
    - 7.78623772e-03
    - 3.02487373e-04
    - 2.11625957e-03
    - 1.55002594e-04
    - 1.09297848e-02
    - 7.80897141e-05
    - 2.00032711e-03
    - 4.34155369e-03
    - 1.42278225e-01
    - 1.12963581e-02
    - 3.66815948e-02
    - 9.90688801e-03
    - 1.26592636e-03
    - 6.36131363e-02
    - 1.95193195e-03
    - 2.22380924e-03
    - 2.42261887e-04
    - 1.79514885e-04
    - 2.21147919e-03
    - 5.97167969e-04
    - 3.30391884e-03

  FINE_OBJECT:
    ENABLED: True
    # Weight relative to standard Stage-3 losses.
    # Start conservatively (0.05) and increase if per-class gains plateau.
    WEIGHT: 0.05
    # Directory containing {city}/{stem}_fine_masks.npz files (train split)
    # Generated by: python -u scripts/generate_sam_fine_masks.py --backend sam3 --split train
    SAM_MASKS_DIR: "/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/"
    # Mode options:
    #   "thing_focal_stuff_entropy" (RECOMMENDED):
    #     - Thing-class masks (bicycle, car, person, ...) → focal CE toward unified
    #       thing channel (last channel of semantic head).  IoU-weighted + focal γ.
    #     - Stuff-class masks (pole, traffic sign, traffic light, guard rail) → entropy
    #       (force commitment to SOME stuff channel, class-agnostic).
    #     - This is the correct mode for CUPS k=80 semantic heads (66 channels).
    #       The old "class_specific" mode mapped bicycle→26, person→17, etc. which
    #       targeted WRONG channels in the 66-channel head (k=80 stuff clusters ≠
    #       Cityscapes 27-class vocabulary).
    #
    #   "thing_entropy_stuff_entropy": same as above but without focal modulation.
    #   "entropy": fully class-agnostic entropy minimization (safest fallback).
    #
    # To enable class-specific stuff supervision: run scripts/extract_cups_class_mapping.py
    # on Santosh's machine with the Stage-3 checkpoint, then add STUFF_CHANNEL_MAP here.
    MODE: "thing_focal_stuff_entropy"
    # Focal loss gamma for thing-class CE.  γ=2 is standard (RetinaNet).
    # Increase to 3.0 if bicycle/motorcycle don't recover after first eval.
    FOCAL_GAMMA: 2.0
    # Soft-weight each mask's loss by its SAM3 IoU score (recommended: True).
    # Replaces the old hard threshold: all masks above MIN_HARD_IOU contribute,
    # weighted continuously by confidence.
    USE_IOU_WEIGHTING: True
    # Hard-discard masks with IoU below this.  SAM3 scores are bounded ~0.7 max,
    # so 0.10 keeps nearly all masks while discarding truly empty outputs.
    MIN_HARD_IOU: 0.10
    # Legacy min_iou_score (also used as the forward() call arg).
    MIN_IOU_SCORE: 0.10
    # Cap masks per image to avoid memory spikes with dense SAM outputs
    MAX_MASKS_PER_IMAGE: 30
    # -1 = use last logit channel (= unified thing-region class in CUPS vocabulary)
    THING_CLASS_IDX: -1
    # STUFF_CHANNEL_MAP: not set yet — run scripts/extract_cups_class_mapping.py first.
    # Once you have it, add entries like:
    #   STUFF_CHANNEL_MAP:
    #     9: 42    # guard_rail SAM3-idx → stuff channel 42 in k=80 head
    #    13: 17    # pole SAM3-idx → stuff channel 17 in k=80 head
    #     4: 28    # traffic sign SAM3-idx → stuff channel 28
    #     5: 31    # traffic light SAM3-idx → stuff channel 31

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
