# Stage-4 Ablation 3: SAM3 Mask-Adapter (CVPR 2025 pattern, Mask-Adapter / Mask-Adapter: The Devil is in the Masks)
#
# Enables cross-attention between ROI box features (query) and DINOv3-pooled
# SAM3 mask embeddings (key/value) at the final Cascade R-CNN stage.
# Adds ~1.6M params on top of the frozen DINOv3 ViT-B/16 backbone.
#
# Architecture:
#   - SAM3MaskAdapter: pool DINOv3 patch tokens under each SAM3 binary mask
#     → 256-dim mask embedding → single-head cross-attention with ROI query
#     → residual update (zero-init: no-op at initialization)
#   - Fires at cascade stage 2 (final) only
#   - SAM3 NPZ files loaded on-the-fly from SAM3_MASKS_DIR
#
# Differences from motorcycle recovery config:
#   - MODEL.ROI_BOX_HEAD.SAM3_MASK_ADAPTER: True
#   - MODEL.ROI_BOX_HEAD.SAM3_MASKS_DIR: path to SAM3 .npz files
#   - MODEL.ROI_BOX_HEAD.SAM3_ADAPTER_DIM: 256 (cross-attn dim)
#   - MODEL.ROI_BOX_HEAD.SAM3_N_MAX_MASKS: 20 (max masks per image)
#   - Stage-3 checkpoint loads cleanly (adapter out_proj is zero-init → no-op at init)
#
# Remote launch:
#   nohup python -u refs/cups/train_self.py \
#       --config refs/cups/configs/train_self_cityscapes_dinov3_vitb_stage4_sam3_adapter_ablation.yaml \
#       > logs/stage4_sam3_adapter_ablation.log 2>&1 &

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc/"

MODEL:
  BACKBONE_TYPE: "dinov3_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  CHECKPOINT: "/home/santosh/experiments/stage3_dcfa_simcf_abc/experiments/cups_dinov3_vitb_dcfa_simcf_abc_stage3/Unsupervised Panoptic Segmentation/mc039mj8/checkpoints/best_pq_step=003000.ckpt"
  ROI_BOX_HEAD:
    USE_SEESAW_LOSS: True
    SEESAW_P: 0.8
    SEESAW_Q: 2.0
    # Ablation 3: SAM3 Mask-Adapter (online cross-attention at final cascade stage)
    SAM3_MASK_ADAPTER: True
    SAM3_ADAPTER_DIM: 256
    SAM3_N_MAX_MASKS: 20
    SAM3_MASKS_DIR: "/home/santosh/datasets/cityscapes/sam_fine_masks_sam3/train/"
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage4_sam3_adapter_ablation"
  RUN_NAME: "cups_dinov3_vitb_stage4_sam3_adapter"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.000025
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.25
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 2500
  ROUNDS: 1
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.5
  CLASS_FREQUENCIES:
