# ABL-A: No DropLoss + No CopyPaste.
# Hypothesis: DropLoss penalises genuine thing queries that have no depth-edge
# pseudo-label (low recall). Removing it should stabilise RQ_things.
# CopyPaste disabled because pasting noisy depth-edge crops confuses instance learning.
# All other params identical to the baseline santosh config.
#
# Changes vs baseline:
#   DROP_LOSS: False          (was True)
#   COPY_PASTE: False         (was True)
#   GRADIENT_CLIP_VAL: 0.05  (was 0.1, tighter to compensate for louder gradients
#                              without DropLoss regularisation)

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  NUM_CLASSES: 27
  NUM_PSEUDO_CLASSES: 27
  IGNORE_UNKNOWN_THING_REGIONS: True
  THING_STUFF_THRESHOLD: 0.08
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cups_pseudo_labels_causetr_anyup_train/"
MODEL:
  BACKBONE_TYPE: "dinov2_vitb"
  DINOV2_FREEZE: True
  USE_DINO: False
  TTA_SCALES:
    - 0.75
    - 1.0
    - 1.25
AUGMENTATION:
  NUM_STEPS_STARTUP: 500
  COPY_PASTE: False
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]
    - [480, 960]
    - [512, 1024]
SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage2_eomt_ablA"
  RUN_NAME: "ablA_nodrop_nopaste"
TRAINING:
  STEPS: 8000
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 500
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: False
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 1000
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 0.05
VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
