# Stage-3: ORIGINAL CUPS self-training recipe, DINOv2 + EoMT network via the
# D2 adapter (cups/model/eomt_d2_adapter.py), entry point train_self_eomt.py.
#
# Byte-for-byte copy of train_self_cityscapes_dinov3_vitb_dcfa_simcf_abc_santosh.yaml
# except: MODEL.CHECKPOINT (EoMT Stage-2 Lightning ckpt), BACKBONE_TYPE marker,
# SYSTEM.LOG_PATH / RUN_NAME.
#
# Target: santosh@172.17.254.146, 2x GTX 1080 Ti (11 GB each).
# SELF_TRAINING: 3 rounds x 4000 steps = 12000 optimizer steps total.

DATA:
  CROP_RESOLUTION: (640, 1280)
  SCALE: 0.625
  DATASET: "cityscapes"
  IGNORE_UNKNOWN_THING_REGIONS: False
  THING_STUFF_THRESHOLD: 0.05
  ROOT: "/home/santosh/datasets/cityscapes/"
  ROOT_VAL: "/home/santosh/datasets/cityscapes/"
  ROOT_PSEUDO: "/home/santosh/datasets/cityscapes/cups_pseudo_labels_dcfa_simcf_abc_spherical_k80/"

MODEL:
  BACKBONE_TYPE: "eomt_dinov2"
  DINOV2_FREEZE: True
  USE_DINO: False
  CHECKPOINT: "/home/santosh/experiments/stage2_eomt_dinov2_vitb_dcfa_simcf_abc_spherical_k80/checkpoints/eomt-step004000-epoch22.ckpt"
  TTA_SCALES:
    - 0.5
    - 0.75
    - 1.0

AUGMENTATION:
  NUM_STEPS_STARTUP: 0
  COPY_PASTE: True
  CONFIDENCE: 0.75
  MAX_NUM_PASTED_OBJECTS: 3
  RESOLUTIONS:
    - [384, 768]
    - [416, 832]
    - [448, 896]

SYSTEM:
  ACCELERATOR: "gpu"
  NUM_GPUS: 2
  NUM_NODES: 1
  NUM_WORKERS: 2
  LOG_PATH: "/home/santosh/experiments/stage3_cups_orig_eomt_dinov2_dcfa_simcf_abc_spherical_k80"
  RUN_NAME: "cups_orig_stage3_eomt_dinov2_dcfa_simcf_abc_spherical_k80"

TRAINING:
  BATCH_SIZE: 1
  ACCUMULATE_GRAD_BATCHES: 8
  PRECISION: "32-true"
  OPTIMIZER: "adamw"
  ADAMW:
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.00001
  VAL_EVERY_N_STEPS: 200
  LOG_EVERT_N_STEPS: 50
  DROP_LOSS: True
  DROP_LOSS_IOU_THRESHOLD: 0.4
  LOG_MEDIA_N_STEPS: 500
  GRADIENT_CLIP_ALGORITHM: "norm"
  GRADIENT_CLIP_VAL: 1.0

SELF_TRAINING:
  ROUND_STEPS: 4000
  ROUNDS: 3
  CONFIDENCE_STEP: 0.05
  USE_DROP_LOSS: False
  SEMANTIC_SEGMENTATION_THRESHOLD: 0.5
  CLASS_THRESHOLD_ALPHA: 0.3

VALIDATION:
  CACHE_DEVICE: "cpu"
  USE_TTA: False
